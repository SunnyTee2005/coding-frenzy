# 可用語言設定表。新增語言（例如 Java）只要在這裡加一筆。
#
# display  : 編譯器選單顯示的文字。Phase 0 反編譯原程式後，改成和考場完全一致的字串。
# source   : 原始碼存檔名稱。
# programs : 依序尋找的執行檔，第一個找得到的就用，代入 {cc}。
# compile  : 編譯指令；Python 只做語法檢查，讓語法錯誤也回報 COMPILER-ERROR。
# run      : 執行指令。
#
# 可用的代換：{cc} 編譯器 / 直譯器、{src} 原始檔、{exe} 執行檔、{shim} bits/stdc++.h 補丁目錄。
# 參數對齊考場的 MinGW GCC 6.3.0（預設 -std=gnu++14）；實際參數以 Phase 0 查到的原程式指令為準。

[[language]]
id = "c"
display = "C"
source = "main.c"
programs = ["gcc", "clang", "cc"]
compile = ["{cc}", "-std=gnu11", "-O2", "-o", "{exe}", "{src}", "-lm"]
run = ["{exe}"]

[[language]]
id = "cpp"
display = "C++"
source = "main.cpp"
programs = ["g++", "clang++", "c++"]
# -idirafter：GCC 自帶的 bits/stdc++.h 會先被找到；Mac 的 clang 沒有，才退回使用補丁。
compile = ["{cc}", "-std=gnu++14", "-O2", "-idirafter", "{shim}", "-o", "{exe}", "{src}", "-lm"]
run = ["{exe}"]

[[language]]
id = "python"
display = "Python 3"
source = "main.py"
programs = ["python3", "python"]
compile = ["{cc}", "-c", "import sys; compile(open(sys.argv[1], encoding='utf-8').read(), sys.argv[1], 'exec')", "{src}"]
run = ["{cc}", "{src}"]
